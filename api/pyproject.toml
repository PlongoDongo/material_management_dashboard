[project]
name = "data-api"
version = "0.1.0"
description = "API layer between the Dash dashboards and the data sources (Neo4j / Postgres)."
requires-python = ">=3.11"
dependencies = [
    # >=0.115 for query parameter models (Annotated[Model, Query()]),
    # which the data product router relies on.
    "fastapi>=0.121.1",   # Depends(scope="function"), see src/api/deps.py
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "polars>=0.20",          # transformations (the same library the dashboards use)
    "sqlalchemy>=2.0",
    "httpx>=0.27",           # client for the Dash apps + tests
    # OIDC: validates the Keycloak access token locally against the
    # realm's public keys. [crypto] pulls in the RS256 backend.
    "pyjwt[crypto]>=2.9",
    # Reads the mounted credentials files (core/config.py).
    "pyyaml>=6.0",
    # Table classes for the ORM write path (db/models.py). Pydantic and
    # SQLAlchemy in one class -- see api/v1/relationships.py.
    "sqlmodel>=0.0.42",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `sources` strips the leading src/ so the modules land at the wheel's top
# level; `only-include` says which tree to take. The obvious alternative,
# `packages = ["src/core", "src/db", ...]`, builds WITHOUT an error but silently
# leaves out the loose modules next to those folders -- main.py and app.py. An
# editable install hides that, because it just puts src/ on the path; it
# surfaces on the first real build.
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Switched on deliberately: the pre-commit hooks enforce these, so the project
# config has to agree with them. If it did not, `ruff --fix` would strip every
# `# noqa` for them as an unused suppression (RUF100) and the next hook run
# would report the same findings all over again.
extend-select = ["ANN", "B905", "ERA001", "LOG004", "PLC0415", "PLR2004", "T201"]
# Our messages carry context only known where the error is raised ("Neo4j
# unavailable: <driver error>"); a class per message would add code, not clarity.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# The expected value in an assertion is the point of the test, not a magic number.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.flake8-annotations]
# `self` and `cls` carry no information -- annotating them is noise.
suppress-dummy-args = true
