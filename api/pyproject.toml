[project]
name = "data-api"
version = "0.1.0"
description = "API-Layer zwischen den Dash-Dashboards und den Datenquellen (Neo4j / Postgres)."
requires-python = ">=3.11"
dependencies = [
    # >=0.115 wegen Query-Parameter-Modellen (Annotated[Model, Query()]),
    # die der Datenprodukt-Router benutzt.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "polars>=0.20",          # Transformationen (dieselbe Bibliothek wie in den Dashboards)
    "sqlalchemy>=2.0",
    "httpx>=0.27",           # Client fuer die Dash-Apps + Tests
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
# Erzeugt docs/architecture.md aus der laufenden App.
architecture-docs = "data_api.architecture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
