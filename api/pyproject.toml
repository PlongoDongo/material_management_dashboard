[project]
name = "data-api"
# Kept in step with `__version__` in src/core/config.py by hand. To make that
# impossible to get wrong, replace this line with
#     dynamic = ["version"]
# and add
#     [tool.hatch.version]
#     path = "src/core/config.py"
# Then this file reads the number out of the code and there is exactly one
# source of truth. Left as a plain string here because it is one line to keep in
# sync and the indirection costs a reader more than the duplication does.
version = "0.1.0"
description = "API layer between the Dash dashboards and the data sources (Neo4j / Postgres)."
requires-python = ">=3.11"
dependencies = [
    # >=0.115 for query parameter models (Annotated[Model, Query()]),
    # which the data product router relies on.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "polars>=0.20",          # transformations (the same library the dashboards use)
    "sqlalchemy>=2.0",
    "httpx>=0.27",           # client for the Dash apps + tests
    # OIDC: validates the Keycloak access token locally against the
    # realm's public keys. [crypto] pulls in the RS256 backend.
    "pyjwt[crypto]>=2.9",
    # Reads the mounted credentials files (core/config.py).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
# Generates docs/architecture.md from the running app.
architecture-docs = "architecture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `sources` strips the leading src/ so the modules land at the wheel's top
# level; `only-include` says which tree to take. The obvious alternative,
# `packages = ["src/core", "src/db", ...]`, builds WITHOUT an error but silently
# leaves out the loose modules next to those folders -- main.py, app.py,
# architecture.py. An editable install hides that, because it just puts src/ on
# the path; it surfaces on the first real build.
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ANN is switched on deliberately: the pre-commit hooks enforce it, so the
# project config has to agree with them. If it did not, `ruff --fix` would strip
# every `# noqa: ANN...` as an unused suppression (RUF100) and the next hook run
# would report the same findings all over again.
extend-select = ["ANN"]

[tool.ruff.lint.flake8-annotations]
# `self` and `cls` carry no information -- annotating them is noise.
suppress-dummy-args = true
